<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Student ID Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .id-card{

            width:380px;
            margin:40px auto;
            border-radius:15px;
            border:2px solid #0d6efd;
            background:white;
            box-shadow:0 8px 20px rgba(0,0,0,.2);
            overflow:hidden;

        }

        .header{

            background:#0d6efd;
            color:white;
            padding:15px;
            text-align:center;
            font-size:24px;
            font-weight:bold;

        }

        .photo{

            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid #0d6efd;

        }

    </style>

</head>

<body>

<div class="id-card">

    <div class="header">
        STUDENT ID CARD
    </div>

    <div class="text-center mt-4">

        <img th:src="@{'/uploads/' + ${student.photo}}"
             class="photo">

    </div>

    <div class="p-4">

        <p><strong>ID :</strong> <span th:text="${student.id}"></span></p>

        <p><strong>Name :</strong> <span th:text="${student.name}"></span></p>

        <p><strong>Email :</strong> <span th:text="${student.email}"></span></p>

        <p><strong>Course :</strong> <span th:text="${student.course}"></span></p>

        <p><strong>Mobile :</strong> <span th:text="${student.mobile}"></span></p>
        <div class="text-center mt-4">

            <img th:if="${qrFile != null}"
                th:src="@{'/uploads/qr/' + ${qrFile}}"
                width="150"
                height="150">

        </div>

    </div>

</div>

<div class="text-center">

    <button onclick="window.print()"
            class="btn btn-primary">
        Print ID Card
    </button>

    <a href="/viewStudents"
       class="btn btn-secondary">
        Back
    </a>

</div>

</body>
</html>
